name: CI

# Check su ogni Pull Request verso main (CLAUDE.md, ARCHITECTURE.md §9).
# Il deploy su dev si aggiunge in Fase 2, dopo che questi check sono verdi.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Mai annullare un run in corso: potrebbe essere a metà di un deploy su dev.
# Un nuovo push sulla stessa PR attende (e sostituisce eventuali run in coda).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0
  DENO_VERSION: 2.9.8
  NODE_VERSION: 22

jobs:
  web:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: "Build (con verifica: nessun segreto, nessuna cache dei dati)"
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_APP_ENV: local
          VITE_BUILD_INFO: CI ${{ github.sha }}
      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Edge Functions (fmt, lint, check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno check .
      - run: deno test --allow-env --allow-read

  database:
    name: Database (migrazioni su DB pulito, pgTAP, esposizione API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Variabili delle function per lo stack locale (mai usate in cloud)
        run: |
          {
            echo "HEALTH_TOKEN=ci-$(openssl rand -hex 16)"
            echo "LOCAL_DB_URL=postgresql://postgres:postgres@db:5432/postgres"
          } > supabase/functions/.env
      # Il runner è sempre nuovo: supabase start applica tutte le migrazioni
      # a un database vuoto. (Un "db reset" qui ricreerebbe il container del DB
      # e le Edge Functions già avviate non ne risolverebbero più il nome.)
      - name: Avvio stack e migrazioni su DB pulito
        run: >
          supabase start
          -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime,storage-api
      - name: Test pgTAP (schema, RLS, privilegi)
        run: supabase test db
      - name: Lint dello schema
        run: supabase db lint --level warning --fail-on warning
      - name: Solo lo schema api è esposto, registrazioni chiuse
        run: |
          PUBLISHABLE_KEY="$(supabase status -o json | jq -r .PUBLISHABLE_KEY)"
          export PUBLISHABLE_KEY
          scripts/check-data-api-exposure.sh
          scripts/check-signup-disabled.sh
      - name: Function health risponde
        run: |
          source supabase/functions/.env
          url=http://127.0.0.1:54321/functions/v1/health
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "401"
          body="$(curl -s -H "x-health-token: $HEALTH_TOKEN" "$url")"
          echo "$body"
          jq -e '.ok == true and .db.db == true' <<<"$body"
      - name: Log dello stack in caso di errore
        if: failure()
        run: |
          docker ps -a || true
          docker logs supabase_edge_runtime_spiccioli 2>&1 | tail -50 || true

  e2e:
    name: E2E Playwright (iPhone WebKit + desktop Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Stack Supabase locale (Auth + Data API)
        run: >
          supabase start
          -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime,storage-api,edge-runtime
      - name: Chiavi locali e utenti di prova (valori di sviluppo, non segreti)
        run: |
          status="$(supabase status -o json)"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")" >> "$GITHUB_ENV"
          password="E2e-$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
          SECRET_KEY="$(jq -r .SECRET_KEY <<<"$status")" E2E_PASSWORD="$password" \
            scripts/e2e-create-users.sh
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps webkit chromium
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_APP_ENV: local
          VITE_BUILD_INFO: E2E ${{ github.sha }}
      - run: npm run e2e
        working-directory: web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  security:
    name: Sicurezza (segreti nel codice, migrazioni distruttive)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Workflow GitHub validi (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.9
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color
      - name: gitleaks su tutta la storia
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
      - name: Solo migrazioni additive
        if: github.event_name == 'pull_request'
        env:
          ALLOW_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'migrazione-distruttiva-approvata') }}
        run: scripts/check-destructive-migrations.sh "origin/${{ github.base_ref }}"

  deploy-dev:
    name: Deploy dev
    needs: [web, functions, database, e2e, security]
    # Solo PR dal repository stesso (mai da fork) e non da Dependabot, che non
    # ha accesso ai segreti degli Environment.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    # Un solo deploy su dev alla volta, tra tutte le PR (ADR-0002).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      include_all: true
      wrangler_env: dev
      build_info: "${{ format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}"
    secrets: inherit

  comment-dev:
    name: Link dev nella PR
    needs: deploy-dev
    if: needs.deploy-dev.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          FRONTEND_URL: ${{ needs.deploy-dev.outputs.frontend_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- spiccioli-deploy-dev -->'
            const body = [
              marker,
              '### Anteprima su dev pronta',
              '',
              `Apri **${process.env.FRONTEND_URL}** da iPhone o PC (credenziali di **dev**).`,
              '',
              `Il badge in fondo alla pagina deve mostrare \`PR #${context.issue.number}\` e il commit \`${process.env.SHA.slice(0, 7)}\`:`,
              'se mostra altro, un\'altra PR è stata pubblicata dopo questa.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
