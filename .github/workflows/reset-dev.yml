name: Reset dev

# Ricrea il database di DEV dalle migrazioni di main (cancella i dati finti di
# sandbox e le migrazioni lasciate da PR abbandonate). Mai su produzione.
on:
  workflow_dispatch:
    inputs:
      conferma:
        description: Scrivi RESET per confermare (cancella tutti i dati di dev)
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  reset:
    name: Reset database dev
    if: inputs.conferma == 'RESET'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Reset (solo dati di sandbox)
        run: supabase db reset --linked --no-seed --yes
      - run: supabase config push --yes
      - run: supabase functions deploy --use-api --project-ref "$PROJECT_REF"
