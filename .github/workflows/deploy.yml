name: Deploy (riusabile)

# Deploy completo su un ambiente: migrazioni + config → Edge Functions →
# frontend → verifiche. Ogni passo parte solo se il precedente è riuscito.
# Chiamato da ci.yml (dev, per le PR) e da deploy-prod.yml (production, su main).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (dev | production)
        type: string
        required: true
      include_all:
        description: Applica anche migrazioni con timestamp precedenti all'ultima (solo dev)
        type: boolean
        default: false
      wrangler_env:
        description: Ambiente Wrangler ("" = prod, "dev" = worker spiccioli-dev)
        type: string
        default: ''
      build_info:
        description: Testo del badge di versione
        type: string
        required: true
    outputs:
      frontend_url:
        value: ${{ jobs.preflight.outputs.frontend_url }}
      deployed:
        value: ${{ jobs.smoke.outputs.deployed }}

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.0
  NODE_VERSION: 22

jobs:
  preflight:
    name: Configurazione ambiente
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      frontend_url: ${{ vars.FRONTEND_URL }}
    steps:
      - id: check
        name: Variabili e segreti presenti
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          FRONTEND: ${{ vars.FRONTEND_URL }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_HEALTH: ${{ secrets.HEALTH_TOKEN != '' }}
        run: |
          missing=()
          [ -n "$REF" ] || missing+=("variabile SUPABASE_PROJECT_REF")
          [ -n "$URL" ] || missing+=("variabile SUPABASE_URL")
          [ -n "$KEY" ] || missing+=("variabile SUPABASE_PUBLISHABLE_KEY")
          [ -n "$FRONTEND" ] || missing+=("variabile FRONTEND_URL")
          [ -n "$CF_ACCOUNT" ] || missing+=("variabile CLOUDFLARE_ACCOUNT_ID")
          [ "$HAS_TOKEN" = "true" ] || missing+=("segreto SUPABASE_ACCESS_TOKEN")
          [ "$HAS_DB_PASSWORD" = "true" ] || missing+=("segreto SUPABASE_DB_PASSWORD")
          [ "$HAS_CF_TOKEN" = "true" ] || missing+=("segreto CLOUDFLARE_API_TOKEN")
          [ "$HAS_HEALTH" = "true" ] || missing+=("segreto HEALTH_TOKEN")
          case "$KEY" in sb_secret_*) missing+=("SUPABASE_PUBLISHABLE_KEY contiene una SECRET key!") ;; esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy su \`${{ inputs.environment }}\` saltato"
              echo "Configurazione incompleta (docs/SETUP.md §6.2):"
              printf -- '- %s\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Deploy saltato: Environment '${{ inputs.environment }}' non configurato (${#missing[@]} valori mancanti)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  database:
    name: Migrazioni e configurazione Supabase
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Letta da config.toml (auth.site_url / additional_redirect_urls).
      SITE_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Collegamento al progetto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrazioni da applicare
        run: supabase migration list
      - name: Applica le migrazioni
        run: |
          if [ "${{ inputs.include_all }}" = "true" ]; then
            supabase db push --include-all --yes
          else
            supabase db push --yes
          fi
      - name: Differenze di configurazione
        run: supabase config diff || true
      - name: Applica la configurazione (config.toml)
        run: supabase config push --yes

  functions:
    name: Edge Functions
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Secret gestiti dalla CI (mai la chiave Enable Banking)
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          umask 077
          env_file="$RUNNER_TEMP/functions.env"
          printf 'HEALTH_TOKEN=%s\nFRONTEND_URL=%s\n' "$HEALTH_TOKEN" "$FRONTEND_URL" > "$env_file"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$env_file"
          rm -f "$env_file"
      - name: Deploy delle Edge Functions
        run: supabase functions deploy --use-api --project-ref "$PROJECT_REF"

  frontend:
    name: Frontend (Cloudflare Workers)
    needs: functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_ENV: ${{ inputs.environment == 'production' && 'prod' || 'dev' }}
          VITE_BUILD_INFO: ${{ inputs.build_info }}
      - name: Deploy su Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: ${{ inputs.wrangler_env != '' && format('deploy --env {0}', inputs.wrangler_env) || 'deploy' }}

  smoke:
    name: Verifiche dopo il deploy
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    outputs:
      deployed: ${{ steps.done.outputs.deployed }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Il frontend risponde ed è la versione appena pubblicata
        run: |
          for _ in $(seq 1 10); do
            if curl -sf "$FRONTEND_URL/" | grep -q '<title>Spiccioli</title>'; then
              echo "OK frontend"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Il frontend $FRONTEND_URL non risponde"
          exit 1
      - name: Edge Function health (database raggiungibile)
        run: |
          body="$(curl -s -H "x-health-token: $HEALTH_TOKEN" "$SUPABASE_URL/functions/v1/health")"
          echo "$body" | jq '{ok, db: .db.db, enable_banking}'
          jq -e '.ok == true and .db.db == true' <<<"$body" >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/functions/v1/health")" = "401"
      - name: Solo lo schema api è esposto
        run: scripts/check-data-api-exposure.sh
      - name: Registrazioni pubbliche disattivate
        run: scripts/check-signup-disabled.sh
      - id: done
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"
